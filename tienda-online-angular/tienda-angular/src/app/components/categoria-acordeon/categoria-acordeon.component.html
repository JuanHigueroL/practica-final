<div class="mb-4">
  <button
    class="categoria-header w-100 d-flex justify-content-between align-items-center border-0"
    (click)="toggleAbierta()"
    [attr.aria-expanded]="abierta()"
  >
    <span class="fs-5 fw-bold d-flex align-items-center gap-2">
      <i
        class="bi bi-chevron-down text-primary transition-smooth"
        [style.transform]="abierta() ? 'rotate(0deg)' : 'rotate(-90deg)'"
        style="transition: transform 0.3s ease;"
      ></i>
      {{ categoria() }}
    </span>
    <span class="badge rounded-pill px-3 py-2 fs-6">
      {{ conStock() }} / {{ productos().length }}
    </span>
  </button>

  <div class="categoria-contenido" [class.oculto]="!abierta()">
    <div>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4 pt-3 pb-2 px-1">
        @for (producto of productos(); track producto.id) {
          <div class="col">
            <app-producto-card [producto]="producto"></app-producto-card>
          </div>
        }
      </div>
    </div>
  </div>
</div>
