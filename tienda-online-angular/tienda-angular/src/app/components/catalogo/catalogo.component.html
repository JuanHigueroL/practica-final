<div style="view-transition-name: catalogo-layout;">
  <style>
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.35s;
    }

    .fade-enter {
      animation: fadeSlideUp 0.3s ease-out forwards;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>

  <div class="mb-4 d-flex align-items-center gap-3 pb-3 border-bottom border-light"
    style="border-bottom-color: rgba(0,0,0,0.05);">
    <div class="bg-primary bg-opacity-10 p-2 rounded-circle">
      <i class="bi bi-grid-fill fs-4 text-primary d-block" style="line-height: 1;"></i>
    </div>
    <h4 class="fw-bolder mb-0 fs-3">Descubre Productos</h4>
  </div>

  <div class="mb-5 position-relative">
    <i class="bi bi-search position-absolute text-muted fs-5"
      style="top: 50%; left: 20px; transform: translateY(-50%);"></i>
    <input type="text" class="form-control form-control-lg bg-light border-0 shadow-sm"
      placeholder="Buscar productos (ej. Auriculares, PC-12...)" [value]="terminoBusqueda()"
      (input)="handleBusquedaChange($event)"
      style="padding-left: 55px; border-radius: 1rem; transition: all 0.3s; outline: none;" />
  </div>

  <div *ngIf="categorias().length === 0" class="alert alert-info border-0 shadow-sm text-center py-5 fade-enter"
    style="border-radius: 1.5rem;">
    <i class="bi bi-emoji-frown text-info fs-1 mb-3 d-block"></i>
    <h5 class="fw-bold">No quedan productos</h5>
    <p class="text-muted mb-0">Prueba borrando parte del nombre buscado.</p>
  </div>

  <div *ngIf="categorias().length > 0" class="d-flex flex-column gap-3">
    <div *ngFor="let cat of categorias()" class="fade-enter">
      <app-categoria-acordeon [categoria]="cat" [productos]="porCategoria()[cat]"></app-categoria-acordeon>
    </div>
  </div>
</div>
