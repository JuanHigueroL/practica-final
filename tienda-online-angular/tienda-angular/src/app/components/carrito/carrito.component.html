<div class="carrito-panel">
  <div class="d-flex align-items-center justify-content-between mb-4 border-bottom border-light pb-3" style="border-bottom-color: rgba(0,0,0,0.05);">
    <h4 class="mb-0 fw-bold d-flex align-items-center gap-2">
      <i class="bi bi-cart3 text-primary"></i> Mi Cesta
    </h4>
    <span class="badge bg-primary rounded-pill px-3 py-2 fs-6 shadow-sm">
      {{ cantidadItems }} ítems
    </span>
  </div>

  <div class="text-center py-5 text-muted fade-enter">
    <div class="mb-3">
      <i class="bi bi-cart-x text-secondary" style="font-size: 3.5rem; opacity: 0.5;"></i>
    </div>
    <h5 class="fw-semibold">Tu cesta está vacía</h5>
    <p class="small mb-0">¡Explora nuestro catálogo y añade productos increíbles!</p>
  </div>

  <div class="mt-4 pt-3 border-top border-light" style="border-top-color: rgba(0,0,0,0.05);">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <span class="text-muted fw-semibold">Total a pagar:</span>
      <span class="fs-3 fw-bolder text-primary">{{ total | number:'1.2-2' }} €</span>
    </div>
    
    <button class="btn btn-primary w-100 py-3 fw-bold shadow-sm d-flex justify-content-center align-items-center gap-2"
            style="border-radius: 12px; font-size: 1.1rem;" disabled>
      <span>Realizar Pedido</span>
      <i class="bi bi-arrow-right-circle-fill"></i>
    </button>
  </div>
</div>
