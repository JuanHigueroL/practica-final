<div class="producto-card d-flex flex-column position-relative" [class.sin-stock]="sinStock()">
  <!-- Muestra el código del producto -->
  <div class="position-absolute top-0 start-0 m-3 z-3">
    <span class="badge bg-light text-dark fw-semibold shadow-sm rounded-pill px-3 py-2 border">
      {{ producto().codigo }}
    </span>
  </div>

  <!-- Contenedor de la imagen. Solo primera foto estática por requerimiento. -->
  <div class="imagen-wrapper">
    <ng-container *ngIf="producto().imagenes && producto().imagenes.length > 0; else noImage">
      <img [src]="producto().imagenes[0]" [alt]="producto().descripcion" class="producto-imagen" />
    </ng-container>
    <ng-template #noImage>
      <div class="h-100 w-100 d-flex flex-column justify-content-center align-items-center text-muted bg-light">
        <i class="bi bi-image" style="font-size: 3rem; opacity: 0.5;"></i>
        <span class="fw-semibold mt-2" style="opacity: 0.7;">No Image</span>
      </div>
    </ng-template>
  </div>

  <!-- Información del producto -->
  <div class="card-body d-flex flex-column h-100">
    <h5 class="card-title fw-bold text-truncate mb-2">{{ producto().descripcion }}</h5>

    <div class="mt-auto d-flex justify-content-between align-items-end pt-3">
      <div>
        <div class="fs-4 fw-bolder text-primary lh-1 mb-1">
          {{ producto().precio | number:'1.2-2' }} €
        </div>
        <div class="small fw-semibold" [ngClass]="sinStock() ? 'text-danger' : 'text-muted'">
          {{ sinStock() ? "❌ Agotado" : ("✓ Stock: " + producto().stock) }}
        </div>
      </div>

      <button class="btn btn-primary rounded-circle p-2 d-flex justify-content-center align-items-center"
        style="width: 45px; height: 45px;" [disabled]="sinStock()" (click)="agregarAlCarrito()"
        [title]="sinStock() ? 'Producto agotado' : 'Añadir al carrito'">
        <ng-container *ngIf="sinStock(); else canBuy">
          <i class="bi bi-x-lg fs-5"></i>
        </ng-container>
        <ng-template #canBuy>
          <i class="bi bi-cart-plus-fill fs-5"></i>
        </ng-template>
      </button>
    </div>
  </div>
</div>
